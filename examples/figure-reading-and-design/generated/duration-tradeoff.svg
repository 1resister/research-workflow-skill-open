<rect x="48" y="633" width="1184" height="67" rx="8" fill="#F3F6FA"/>
<text x="66" y="660" font-size="16" fill="#172033" text-anchor="start" font-weight="400">Rest joins: quintic is C² (classical jerk undefined at joins); septic is C³.</text>
<text x="66" y="685" font-size="16" fill="#526174" text-anchor="start" font-weight="400">Deterministic selected cases; no error bars, global time-optimality claim or hardware result.</text>
