<text x="67" y="389.235330322367" font-size="14" fill="#526174" text-anchor="end" font-weight="400">0.5</text>
<line x1="80.000" y1="325.765" x2="620.000" y2="325.765" stroke="#DDE4ED" stroke-width="1" />
<text x="67" y="330.7646696776329" font-size="14" fill="#526174" text-anchor="end" font-weight="400">1</text>
<line x1="80.000" y1="267.294" x2="620.000" y2="267.294" stroke="#DDE4ED" stroke-width="1" />
<text x="67" y="272.2940090328988" font-size="14" fill="#526174" text-anchor="end" font-weight="400">2</text>
<line x1="80.000" y1="190.000" x2="620.000" y2="190.000" stroke="#DDE4ED" stroke-width="1" />
<text x="67" y="195.0" font-size="14" fill="#526174" text-anchor="end" font-weight="400">5</text>
