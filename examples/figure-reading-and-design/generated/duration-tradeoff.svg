<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title description">
<title id="title">Duration and endpoint continuity trade-off</title>
<desc id="description">Panel A shows log-log duration points for two fixed polynomial families. Panel B shows septic duration changes of about −4.35%, −4.35%, +14.08% and +16.67%. These are selected deterministic computations, not hardware measurements.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} *{box-sizing:border-box}</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="48" y="48" font-size="28" fill="#172033" text-anchor="start" font-weight="700">Endpoint jerk continuity and fixed-shape duration</text>
<text x="48" y="82" font-size="18" fill="#526174" text-anchor="start" font-weight="400">Selected rest-to-rest cases; V=0.5 m/s, A=1 m/s², J=20 m/s³</text>
<text x="80" y="130" font-size="21" fill="#172033" text-anchor="start" font-weight="700">A  Minimum feasible duration</text>
<text x="760" y="130" font-size="21" fill="#172033" text-anchor="start" font-weight="700">B  Septic relative to quintic</text>
<text x="80" y="163" font-size="15" fill="#526174" text-anchor="start" font-weight="400">Time (s; logarithmic scale)</text>
<text x="760" y="163" font-size="15" fill="#526174" text-anchor="start" font-weight="400">100 × (Tseptic / Tquintic − 1), %</text>
<line x1="80.000" y1="520.000" x2="620.000" y2="520.000" stroke="#DDE4ED" stroke-width="1" />
<text x="67" y="525.0" font-size="14" fill="#526174" text-anchor="end" font-weight="400">0.1</text>
