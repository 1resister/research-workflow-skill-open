<line x1="760.000" y1="520.000" x2="1210.000" y2="520.000" stroke="#7F8B9A" stroke-width="1" />
<text x="350" y="579" font-size="17" fill="#172033" text-anchor="middle" font-weight="400">Travel distance (mm; log scale)</text>
<text x="985" y="579" font-size="17" fill="#172033" text-anchor="middle" font-weight="400">Travel distance (mm; log scale)</text>
<circle cx="130" cy="235" r="6" fill="white" stroke="#2563EB" stroke-width="2.5"/>
<text x="147" y="241" font-size="16" fill="#172033" text-anchor="start" font-weight="400">Quintic</text>
<rect x="124" y="258" width="12" height="12" fill="none" stroke="#DC2626" stroke-width="2.5"/>
<text x="147" y="270" font-size="16" fill="#172033" text-anchor="start" font-weight="400">Septic</text>
